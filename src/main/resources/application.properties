spring.application.name=nograu

spring.datasource.url=jdbc:mysql://localhost:3306/db_nograu
spring.datasource.username=root
spring.datasource.password=example
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

nograu.base-url=http://localhost:8080

# Compressão de respostas HTTP
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,image/svg+xml,application/json

# Cache de assets estáticos: curto no servidor de origem, já que o Cloudflare
# cuida do cache de CDN na frente. Evita que navegadores fiquem presos a uma
# versão antiga do HTML/JS por até 1 ano a cada deploy.
spring.web.resources.cache.period=3600

